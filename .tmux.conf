set-option -g escape-time 10
set -g mouse on
set -g status off
set -g allow-passthrough on

# Set default terminal - needed for proper key handling in Kitty
set -g default-terminal "screen-256color"
# Enable proper key handling for Kitty (xterm-kitty sends Alt keys as escape sequences)
set -ga terminal-overrides ",xterm-kitty:RGB"
set -ga terminal-overrides ",xterm-kitty:km"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:km"

bind-key -n M-a run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -n M-s run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -n M-d run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -n M-f run-shell "tmux neww tmux-sessionizer -s 3"
bind-key -n M-t run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
