set-option -g escape-time 10
set -g mouse on
set -g status off
set -g allow-passthrough on
bind-key -n M-a run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -n M-s run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -n M-d run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -n M-f run-shell "tmux neww tmux-sessionizer -s 3"
bind-key -n M-t run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
