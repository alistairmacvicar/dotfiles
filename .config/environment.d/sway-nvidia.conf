# NVIDIA-specific environment variables for Sway
# These fix cursor issues and rendering artifacts

# Fix missing cursor on NVIDIA GPUs
WLR_NO_HARDWARE_CURSORS=1

# Use NVIDIA drivers
LIBVA_DRIVER_NAME=nvidia
__GLX_VENDOR_LIBRARY_NAME=nvidia

# Enable GBM backend (required for NVIDIA 495+)
GBM_BACKEND=nvidia-drm
__GL_GSYNC_ALLOWED=0
__GL_VRR_ALLOWED=0

# Wayland-specific
MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM=wayland
XDG_SESSION_TYPE=wayland
